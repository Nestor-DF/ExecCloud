<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExecCloud — Run Compiled Binaries in the Cloud</title>
    <meta name="description" content="ExecCloud lets you dynamically upload and execute compiled binaries on the server. Manage services with ease.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1><span class="highlight">ExecCloud</span></h1>
            <p>Dynamically execute compiled binaries on the server.</p>
            <button id="openUploadBtn" class="btn btn-primary">Add New Service</button>
        </header>

        <!-- Search Bar -->
        <div class="search-container" id="searchContainer">
            <div class="search-input-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" placeholder="Search services by name or description..." autocomplete="off">
                <button id="clearSearchBtn" class="search-clear-btn" aria-label="Clear search" title="Clear search">&times;</button>
            </div>
            <p id="searchResultsInfo" class="search-results-info"></p>
        </div>

        <main>
            <div id="servicesGrid" class="services-grid">
                <!-- Service preview cards will be dynamically injected here -->
            </div>

            <!-- Pagination -->
            <div id="paginationControls" class="pagination-controls">
                <button id="prevPageBtn" class="btn btn-secondary pagination-btn" disabled>&larr; Previous</button>
                <span id="pageInfo" class="page-info"></span>
                <button id="nextPageBtn" class="btn btn-secondary pagination-btn">Next &rarr;</button>
            </div>
        </main>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" data-modal="uploadModal">&times;</span>
            <h2>Upload New Service</h2>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="configFile">Service Config (.json)</label>
                    <input type="file" id="configFile" name="config" accept=".json" required>
                </div>
                <div class="form-group">
                    <label for="binaryFile">Executable Binary</label>
                    <input type="file" id="binaryFile" name="binary" required>
                </div>
                <button type="submit" class="btn btn-primary full-width">Upload Service</button>
                <div id="uploadStatus" class="status-message"></div>
            </form>
        </div>
    </div>

    <!-- Service Execution Modal -->
    <div id="serviceModal" class="modal">
        <div class="modal-content modal-content--service">
            <span class="close-btn" data-modal="serviceModal">&times;</span>
            <div id="serviceModalBody">
                <!-- Dynamically injected -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
