<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExecCloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1><span class="highlight">ExecCloud</span></h1>
            <p>Dynamically execute compiled binaries on the server.</p>
            <button id="openUploadBtn" class="btn btn-primary">Add New Service</button>
        </header>

        <main>
            <div id="servicesGrid" class="services-grid">
                <!-- Services will be dynamically injected here -->
            </div>
        </main>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Upload New Service</h2>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="configFile">Service Config (.json)</label>
                    <input type="file" id="configFile" name="config" accept=".json" required>
                </div>
                <div class="form-group">
                    <label for="binaryFile">Executable Binary</label>
                    <input type="file" id="binaryFile" name="binary" required>
                </div>
                <button type="submit" class="btn btn-primary full-width">Upload Service</button>
                <div id="uploadStatus" class="status-message"></div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
